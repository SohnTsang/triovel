<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Trip — Triovel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: #fff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #111; color: #ccc; }
            .card { background: #1c1c1e; border-color: #2c2c2e; }
            .code { background: #2c2c2e; color: #e0e0e0; }
        }
        .card {
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 48px 32px;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
        }
        .logo {
            font-size: 18px;
            font-weight: 700;
            color: #4a9d9a;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 15px;
            color: #888;
            margin-bottom: 24px;
        }
        .code {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            background: #f5f5f5;
            padding: 12px 24px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: #4a9d9a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-secondary {
            background: none;
            color: #4a9d9a;
            font-size: 14px;
            padding: 10px;
        }
        .status {
            font-size: 13px;
            color: #888;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">TRIOVEL</div>
        <h1 id="title">You're invited to a trip</h1>
        <p class="subtitle" id="subtitle">Open the Triovel app to join</p>
        <div class="code" id="invite-code">...</div>
        <a class="btn" id="open-app" href="#">Open in Triovel</a>
        <a class="btn btn-secondary" id="get-app" href="https://apps.apple.com/app/triovel/id000000000">Don't have the app? Get Triovel</a>
        <p class="status" id="status"></p>
    </div>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');

        if (!code) {
            document.getElementById('title').textContent = 'Invalid invite link';
            document.getElementById('subtitle').textContent = 'This link doesn\'t contain a valid invite code.';
            document.getElementById('invite-code').style.display = 'none';
            document.getElementById('open-app').style.display = 'none';
            return;
        }

        // Show the code
        document.getElementById('invite-code').textContent = code;

        // Build deep link
        var deepLink = 'triovel://trip/' + encodeURIComponent(code);
        var openBtn = document.getElementById('open-app');
        openBtn.href = deepLink;

        // Try to open the app automatically
        var status = document.getElementById('status');

        // On mobile, try the deep link immediately
        var userAgent = navigator.userAgent.toLowerCase();
        var isIOS = /iphone|ipad|ipod/.test(userAgent);
        var isAndroid = /android/.test(userAgent);

        if (isIOS || isAndroid) {
            // Try to open the app
            var start = Date.now();
            window.location.href = deepLink;

            // If we're still here after 1.5s, app isn't installed
            setTimeout(function() {
                if (Date.now() - start < 2000) {
                    status.textContent = 'If the app didn\'t open, tap the button above.';
                }
            }, 1500);
        }

        // Manual open button
        openBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = deepLink;

            setTimeout(function() {
                status.textContent = 'App not opening? Copy the code and enter it manually in the app.';
            }, 2000);
        });
    })();
    </script>
</body>
</html>
