# PowerSync Sync Rules for Triovel
#
# Deploy in the PowerSync Dashboard under "Sync Streams".
# Use request.user_id() to access the JWT sub claim (authenticated user ID).
#
# Key privacy rule: private posts sync ONLY to the owning user.
# All other trip-scoped data syncs to all trip members.

bucket_definitions:
  global_users:
    data:
      - SELECT * FROM users

  by_trip:
    parameters: SELECT trip_id FROM trip_members WHERE user_id = request.user_id()
    data:
      - SELECT * FROM trips WHERE id = bucket.trip_id
      - SELECT * FROM trip_members WHERE trip_id = bucket.trip_id
      - SELECT * FROM blocks WHERE trip_id = bucket.trip_id
      - SELECT * FROM posts WHERE trip_id = bucket.trip_id AND (visibility = 'shared' OR user_id = request.user_id())
      - SELECT * FROM bills WHERE trip_id = bucket.trip_id
      - SELECT * FROM bill_shares WHERE trip_id = bucket.trip_id
      - SELECT * FROM payments WHERE trip_id = bucket.trip_id
