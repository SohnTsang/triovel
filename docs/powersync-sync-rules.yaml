# PowerSync Sync Streams for Triovel
#
# Deploy in the PowerSync Dashboard under "Sync Streams".
# Uses edition 3 (Sync Streams format, not legacy Sync Rules).
#
# LIMITATION: Edition 3 auto_subscribe streams do NOT support per-user
# filtering. Functions like auth.user_id(), request.user_id(), and
# token_parameters.user_id all fail in this context.
#
# Private post isolation is enforced CLIENT-SIDE (defense-in-depth):
#   - PostRepository: WHERE visibility = 'shared' OR user_id = ?
#   - PostMediaRepository: same JOIN filter on watchMediaForBlock
#   - SyncManager: privacy audit logs any leaked private posts on connect
#   - ImageCache: cleared on sign-out to prevent data leaks between accounts
#
# For full server-side filtering, would need to migrate to Edition 1
# bucket-based sync rules or PowerSync parameterized streams.

streams:
  global_users:
    auto_subscribe: true
    query: SELECT * FROM users

  trips:
    auto_subscribe: true
    query: SELECT * FROM trips

  trip_members:
    auto_subscribe: true
    query: SELECT * FROM trip_members

  blocks:
    auto_subscribe: true
    query: SELECT * FROM blocks

  posts:
    auto_subscribe: true
    query: SELECT * FROM posts

  bills:
    auto_subscribe: true
    query: SELECT * FROM bills

  bill_shares:
    auto_subscribe: true
    query: SELECT * FROM bill_shares

  payments:
    auto_subscribe: true
    query: SELECT * FROM payments

  post_media:
    auto_subscribe: true
    query: SELECT * FROM post_media

  block_documents:
    auto_subscribe: true
    query: SELECT * FROM block_documents

config:
  edition: 3
