# PowerSync Sync Streams for Triovel
#
# Deploy in the PowerSync Dashboard under "Sync Streams".
# Uses edition 3 (Sync Streams format, not legacy Sync Rules).
#
# IMPORTANT: auth.user_id() in JOIN queries causes data to disappear
# after sync reconciliation. Use unfiltered queries for now.
# Private post filtering handled client-side (SQL WHERE clause).

streams:
  global_users:
    auto_subscribe: true
    query: SELECT * FROM users

  trips:
    auto_subscribe: true
    query: SELECT * FROM trips

  trip_members:
    auto_subscribe: true
    query: SELECT * FROM trip_members

  blocks:
    auto_subscribe: true
    query: SELECT * FROM blocks

  posts:
    auto_subscribe: true
    query: SELECT * FROM posts

  bills:
    auto_subscribe: true
    query: SELECT * FROM bills

  bill_shares:
    auto_subscribe: true
    query: SELECT * FROM bill_shares

  payments:
    auto_subscribe: true
    query: SELECT * FROM payments

  post_media:
    auto_subscribe: true
    query: SELECT * FROM post_media

config:
  edition: 3
