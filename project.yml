name: Triovel
options:
  bundleIdPrefix: com.triovel
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    INFOPLIST_FILE: Triovel/Info.plist
    CODE_SIGN_ENTITLEMENTS: Triovel/Triovel.entitlements

targets:
  Triovel:
    type: application
    platform: iOS
    sources:
      - Triovel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.triovel.app
        INFOPLIST_FILE: Triovel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Triovel/Triovel.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: supabase-swift
        product: Supabase

packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
